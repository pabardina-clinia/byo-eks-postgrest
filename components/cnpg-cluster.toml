type         = "kubernetes_manifest"
name         = "cnpg_cluster"
namespace    = "{{.nuon.install.inputs.namespace}}"
dependencies = []

manifest = """
apiVersion: v1
kind: ConfigMap
metadata:
  name: nuon-db-config
  namespace: {{.nuon.install.inputs.namespace}}
data:
  db_type: "{{.nuon.install.inputs.db_type}}"
{{- if eq .nuon.install.inputs.db_type "cnpg"}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster
  namespace: {{.nuon.install.inputs.namespace}}
spec:
  instances: 1
  storage:
    size: 8Gi
    storageClass: csi-gp3
  bootstrap:
    initdb:
      database: app
      owner: app
      postInitApplicationSQL:
        - "CREATE SCHEMA IF NOT EXISTS api;"
        - "CREATE TABLE api.todos (id int PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY, done boolean NOT NULL DEFAULT false, task text NOT NULL, due timestamptz);"
        - "INSERT INTO api.todos (task) VALUES ('finish tutorial 0'), ('pat self on back');"
        - "CREATE TABLE api.lists (id int PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY, name text NOT NULL, created_at timestamptz NOT NULL DEFAULT now());"
        - "CREATE TABLE api.items (id int PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY, list_id int NOT NULL REFERENCES api.lists(id) ON DELETE CASCADE, content text NOT NULL, done boolean NOT NULL DEFAULT false, created_at timestamptz NOT NULL DEFAULT now());"
        - "INSERT INTO api.lists (name) VALUES ('Groceries'), ('Project Tasks');"
        - "INSERT INTO api.items (list_id, content) VALUES (1, 'Apples'), (1, 'Bread'), (1, 'Coffee'), (2, 'Set up PostgREST'), (2, 'Deploy to Nuon'), (2, 'Test the API');"
        - "GRANT USAGE ON SCHEMA api TO app;"
        - "GRANT SELECT ON api.todos TO app;"
        - "GRANT SELECT ON api.lists TO app;"
        - "GRANT SELECT ON api.items TO app;"
{{- end}}
"""
