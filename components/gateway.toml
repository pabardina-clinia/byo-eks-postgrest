type      = "kubernetes_manifest"
name      = "gateway"
namespace = "envoy-system"

dependencies = ["envoy_gateway"]

manifest = """
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nuon-poc-proxy
  namespace: envoy-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        type: LoadBalancer
        loadBalancerClass: service.k8s.aws/nlb
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-name: nuon-poc-envoy-gateway
          service.beta.kubernetes.io/aws-load-balancer-type: "external"
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nuon-poc-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nuon-poc-proxy
    namespace: envoy-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nuon-poc-gateway
  namespace: envoy-system
spec:
  gatewayClassName: nuon-poc-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
"""
